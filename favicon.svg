<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0a0f28"/>
      <stop offset="60%" stop-color="#06091c"/>
      <stop offset="100%" stop-color="#02030a"/>
    </radialGradient>

    <radialGradient id="planet" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#9fe4ff"/>
      <stop offset="25%" stop-color="#4a9dff"/>
      <stop offset="60%" stop-color="#2a3dd8"/>
      <stop offset="100%" stop-color="#060826"/>
    </radialGradient>

    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="25%" stop-color="#e879f9"/>
      <stop offset="55%" stop-color="#c084fc"/>
      <stop offset="80%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#4c1d95" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- Mask so the back of the ring hides behind the planet -->
    <mask id="ringMask">
      <rect width="64" height="64" fill="white"/>
      <circle cx="32" cy="33" r="17" fill="black"/>
    </mask>
  </defs>

  <!-- Rounded dark background -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5"
        fill="none" stroke="rgba(120,170,255,0.22)" stroke-width="1"/>

  <!-- soft outer glow -->
  <circle cx="32" cy="33" r="30" fill="url(#glow)"/>

  <!-- back half of the ring (clipped behind planet) -->
  <g mask="url(#ringMask)" transform="rotate(-18 32 33)">
    <ellipse cx="32" cy="33" rx="26" ry="8"
             fill="none" stroke="url(#ring)" stroke-width="2.4"
             stroke-linecap="round"/>
  </g>

  <!-- planet body -->
  <circle cx="32" cy="33" r="17" fill="url(#planet)"/>
  <circle cx="32" cy="33" r="17" fill="none"
          stroke="rgba(120,190,255,0.35)" stroke-width="0.7"/>

  <!-- subtle highlight -->
  <ellipse cx="26" cy="26" rx="6" ry="4.5"
           fill="#cfeaff" opacity="0.55"/>
  <circle cx="24.5" cy="24.5" r="1.4" fill="#ffffff" opacity="0.95"/>

  <!-- front half of the ring (on top of planet) -->
  <g transform="rotate(-18 32 33)">
    <path d="M 6 33 A 26 8 0 0 0 58 33"
          fill="none" stroke="url(#ring)" stroke-width="2.6"
          stroke-linecap="round"/>
    <path d="M 9 33 A 23 6.6 0 0 0 55 33"
          fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="0.6"
          opacity="0.7"/>
  </g>
</svg>